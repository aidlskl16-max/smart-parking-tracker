server {
    listen 80;
    server_name _;

    # לוח הבקרה (HTML + JavaScript)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Reverse Proxy: כל בקשה שמתחילה ב-/api/ עוברת לשרת ה-API.
    # "api" הוא שם השירות ב-docker-compose – ה-DNS הפנימי של Docker מתרגם אותו לכתובת IP.
    # כך הדפדפן מדבר רק עם פורט אחד, ואין בעיות CORS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
