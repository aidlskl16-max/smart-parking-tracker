# ============================================================
#  הגדרות שרת Nginx ("המלצר")
#  שני תפקידים: 1. להגיש את לוח הבקרה  2. להעביר בקשות /api/ לשרת ה-API
# ============================================================

# מגדירים "שרת" אחד
server {
    # מאזינים לפורט 80 (הפורט הרגיל של אתרים). docker-compose מחבר אותו ל-8080 במחשב
    listen 80;
    # "_" = עונים לכל שם אתר (לא משנה איך פנו אלינו)
    server_name _;

    # ---------- תפקיד 1: להגיש את לוח הבקרה ----------
    # כל כתובת שמתחילה ב-"/" (כלומר כל מה שלא נתפס למטה)
    location / {
        # התיקייה שבה נמצאים קבצי האתר בתוך הקונטיינר
        root  /usr/share/nginx/html;
        # הקובץ שמוצג כשנכנסים לכתובת הראשית
        index index.html;
    }

    # ---------- תפקיד 2: Reverse Proxy ל-API ----------
    # כל בקשה שמתחילה ב-/api/ (למשל /api/cars)
    location /api/ {
        # מעבירים אותה לשרת "api" בפורט 3000.
        # "api" = שם השירות ב-docker-compose. ה-DNS הפנימי של Docker מתרגם אותו לכתובת IP.
        # כך הדפדפן מדבר רק עם פורט אחד, ואין בעיות CORS
        proxy_pass http://api:3000;
        # מעבירים לשרת את שם האתר המקורי שהדפדפן ביקש
        proxy_set_header Host $host;
        # מעבירים לשרת את כתובת ה-IP האמיתית של המשתמש
        proxy_set_header X-Real-IP $remote_addr;
    }
}
